name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descompactar ZIP
        run: |
          for f in *.zip; do [ -f "$f" ] && unzip -oq "$f"; done; true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Gerar APK
        run: |
          FILE=$(find . -name settings.gradle.kts | head -n 1)
          if [ -z "$FILE" ]; then echo "ERRO: projeto nao encontrado"; ls -R | head -50; exit 1; fi
          cd "$(dirname "$FILE")"
          gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: TrucoAssist-apk
          path: "**/app-debug.apk"
